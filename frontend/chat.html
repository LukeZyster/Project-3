<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — StudentMarket</title>
  <meta name="description" content="Chat with buyers and sellers on StudentMarket.">
  <meta name="theme-color" content="#0d1d2a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="siteNav" class="nav"></header>

  <main class="wrap">
    <div class="chat panel" id="chat">
      <aside class="threads">
        <div class="threads__head"><span class="eyebrow">Inbox</span><h2 style="margin-top:8px">Messages</h2></div>
        <div class="threads__list" id="threads"></div>
      </aside>
      <section class="convo" id="convo">
        <div class="convo__empty">
          <i data-lucide="messages-square"></i>
          <h3 style="color:var(--ink)">Pick a conversation</h3>
          <p>Message a seller from any listing and the chat lands here.</p>
          <a class="btn btn--primary btn--sm" href="marketplace.html">Browse listings</a>
        </div>
      </section>
    </div>
  </main>
  <footer id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
