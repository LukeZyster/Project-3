<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — StudentMarket</title>
  <meta name="description" content="Sign in to StudentMarket.">
  <meta name="theme-color" content="#0d1d2a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-no-tabbar>
  <header id="siteNav" class="nav"></header>

  <main class="auth">
    <aside class="auth__art"><div><span class="eyebrow" style="color:var(--accent-soft)">StudentMarket</span><h1 style="margin-top:16px">Welcome back to the board.</h1><p>Your chats, saved items and listings are right where you left them.</p></div><div class="auth__pins"><figure class="pin pin--1"><img src="assets/images/merch/student-tee.jpg" alt=""><figcaption>Tee <b>R120</b></figcaption></figure><figure class="pin pin--2"><img src="assets/images/merch/notebook.jpg" alt=""><figcaption>Notes <b>R60</b></figcaption></figure><figure class="pin pin--3"><img src="assets/images/merch/varsity-mug.jpg" alt=""><figcaption>Mug <b>R50</b></figcaption></figure></div></aside>
    <section class="auth__form">
      <form class="auth__card" id="loginForm" novalidate>
        <span class="eyebrow">Sign in</span>
        <h2>Good to see you.</h2>
        <p class="lede">Use the email you signed up with.</p>
        <p class="notice notice--warn" id="why" hidden></p>
        <label class="field"><span>Email</span><input name="email" type="email" required autocomplete="email" placeholder="you@mycput.ac.za"><small>Your @mycput.ac.za or @cput.ac.za address</small></label>
        <label class="field"><span>Password</span><div class="pw"><input name="password" type="password" required minlength="6" autocomplete="current-password"><button type="button" data-pw aria-label="Show password"><i data-lucide="eye"></i></button></div></label>
        <p class="form-msg" id="msg" role="status"></p>
        <button class="btn btn--primary btn--block" type="submit"><i data-lucide="log-in"></i>Sign in</button>
        <p class="auth__alt">New here? <a href="register.html" id="toRegister">Create an account</a></p>
      </form>
    </section>
  </main>
  <footer id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
