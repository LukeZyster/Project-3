<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your account — StudentMarket</title>
  <meta name="description" content="Manage your StudentMarket listings, saved items and orders.">
  <meta name="theme-color" content="#0d1d2a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="siteNav" class="nav"></header>

  <main class="wrap">
    <section class="profile-top panel reveal">
      <label class="profile-av" id="avatar" title="Change photo"><span id="avatarInner">S</span><input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp" hidden></label>
      <div>
        <h1 id="pName">Your profile</h1>
        <p class="muted" id="pMeta"></p>
      </div>
      <div class="profile-top__actions">
        <a class="btn btn--accent btn--sm" href="sell.html"><i data-lucide="plus"></i>New listing</a>
        <button class="btn btn--ghost btn--sm" id="signOut"><i data-lucide="log-out"></i>Sign out</button>
      </div>
    </section>

    <section class="kpis">
      <div class="kpi panel reveal"><b id="kActive">0</b><span>active listings</span></div>
      <div class="kpi panel reveal"><b id="kSold">0</b><span>sold</span></div>
      <div class="kpi panel reveal"><b id="kSaved">0</b><span>saved items</span></div>
      <div class="kpi panel reveal"><b id="kOrders">0</b><span>store orders</span></div>
    </section>

    <nav class="tabs" role="tablist">
      <button class="is-active" data-tab="listings" role="tab"><i data-lucide="layout-grid"></i>My listings</button>
      <button data-tab="saved" role="tab"><i data-lucide="heart"></i>Saved</button>
      <button data-tab="orders" role="tab"><i data-lucide="receipt"></i>Orders</button>
      <button data-tab="details" role="tab"><i data-lucide="user-round-pen"></i>Details</button>
    </nav>

    <section class="tab-panel" data-panel="listings"><div class="grid" id="myListings"></div></section>
    <section class="tab-panel" data-panel="saved" hidden><div class="grid" id="savedGrid"></div></section>
    <section class="tab-panel" data-panel="orders" id="orders" hidden><div id="ordersList"></div></section>
    <section class="tab-panel" data-panel="details" hidden>
      <form class="panel profile-form" id="profileForm">
        <div class="field-row">
          <label class="field"><span>Full name</span><input name="full_name" required maxlength="80"></label>
          <label class="field"><span>Campus</span><input name="campus" maxlength="60" list="campusList"></label>
        </div>
        <div class="field-row">
          <label class="field"><span>Course</span><input name="course" maxlength="100" placeholder="e.g. Diploma in ICT"></label>
          <label class="field"><span>Year of study</span><select name="year_of_study"><option value="">—</option><option>1st year</option><option>2nd year</option><option>3rd year</option><option>4th year</option><option>Postgrad</option></select></label>
        </div>
        <label class="field"><span>A line about you</span><textarea name="bio" maxlength="240" rows="3" placeholder="e.g. ICT student, usually around the library on Tuesdays."></textarea></label>
        <datalist id="campusList"><option>District Six</option><option>Bellville</option><option>Mowbray</option><option>Granger Bay</option><option>Wellington</option></datalist>
        <p class="form-msg" id="profileMsg" role="status"></p>
        <div><button class="btn btn--primary" type="submit"><i data-lucide="save"></i>Save details</button></div>
      </form>
    </section>
  </main>
  <footer id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
